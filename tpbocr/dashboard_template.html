<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>TPB Typeface-Rank OCR — डैशबोर्ड</title>
<style>
:root{
  --r5:#c62828; --r4:#d87800; --r3:#1a7a3c; --r2:#1e5ac8; --r1:#7a3caa;
  --bg:#0f1216; --panel:#171c22; --ink:#e8edf2; --mut:#9aa7b4; --line:#2a333d;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);
  font:14px/1.5 "Segoe UI",system-ui,sans-serif}
header{padding:14px 20px;border-bottom:1px solid var(--line);
  display:flex;gap:20px;align-items:baseline;flex-wrap:wrap}
h1{font-size:18px;margin:0;font-weight:650}
.sub{color:var(--mut);font-size:12px}
.wrap{display:flex;gap:16px;padding:16px;align-items:flex-start;flex-wrap:wrap}
.left{flex:1 1 620px;min-width:360px}
.right{flex:1 1 360px;min-width:320px}
.tabs{display:flex;gap:6px;margin-bottom:10px}
.tab{padding:6px 14px;background:var(--panel);border:1px solid var(--line);
  border-radius:7px;cursor:pointer;color:var(--mut)}
.tab.on{color:#fff;border-color:#3b82f6;background:#1d2b3a}
.toolbar{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px;align-items:center}
.btn{padding:4px 10px;background:var(--panel);border:1px solid var(--line);
  border-radius:6px;cursor:pointer;color:var(--mut);font-size:12px}
.btn.on{color:#fff;border-color:#3b82f6}
.stage{position:relative;border:1px solid var(--line);border-radius:8px;
  overflow:hidden;background:#000;line-height:0}
.stage img{width:100%;display:block;filter:grayscale(1) contrast(1.05)}
.box{position:absolute;border:2px solid var(--mut);border-radius:2px;cursor:pointer}
.box.wrong{border-style:dashed;border-width:3px;box-shadow:0 0 0 2px #ff2d2d88}
.box .tag{position:absolute;top:-13px;left:-1px;font:700 10px/1 monospace;
  padding:1px 2px;border-radius:2px;color:#fff}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:8px;
  padding:12px 14px;margin-bottom:14px}
.panel h3{margin:0 0 8px;font-size:13px;color:var(--mut);
  text-transform:uppercase;letter-spacing:.05em;font-weight:650}
.kpi{display:flex;gap:14px;flex-wrap:wrap}
.kpi .b{background:#10151b;border:1px solid var(--line);border-radius:8px;
  padding:8px 12px;min-width:92px}
.kpi .n{font-size:22px;font-weight:700}
.kpi .l{font-size:11px;color:var(--mut)}
table{border-collapse:collapse;width:100%;font-size:12px}
th,td{border:1px solid var(--line);padding:4px 7px;text-align:center}
th{color:var(--mut);font-weight:600}
.sw{display:inline-block;width:11px;height:11px;border-radius:2px;margin-right:5px;
  vertical-align:-1px}
.leg{display:flex;flex-direction:column;gap:4px;font-size:12px}
.bar{height:9px;background:#10151b;border-radius:5px;overflow:hidden;margin-top:3px}
.bar>span{display:block;height:100%;background:#3b82f6}
#detail{min-height:70px;font-size:13px}
#detail .big{font-size:16px;font-weight:700}
.mut{color:var(--mut)}
.row{display:flex;justify-content:space-between;border-bottom:1px dashed var(--line);
  padding:3px 0}
.pill{padding:1px 7px;border-radius:10px;color:#fff;font-size:11px;font-weight:600}
code{background:#10151b;padding:1px 5px;border-radius:4px}
.controls{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:8px}
.controls label{color:var(--mut);font-size:12px}
select{background:var(--panel);color:var(--ink);border:1px solid var(--line);
  border-radius:6px;padding:4px 8px;font:13px/1.3 "Segoe UI",system-ui,sans-serif}
.engbadge{font-size:11px;color:var(--mut)}
.dl{display:flex;flex-direction:column;gap:6px}
.dl .btn{text-align:left;color:var(--ink)}
.dl .btn:hover{border-color:#3b82f6}
.hint{color:var(--mut);font-size:11px;margin-top:4px}
</style>
</head>
<body>
<header>
  <h1>TPB Typeface-Rank OCR</h1>
  <span class="sub">Boenninghausen/Allen 1891 — हर remedy का rank उसके फ़ॉन्ट से · नीला=सही सीमा, लाल डैश=गलती</span>
</header>
<div class="wrap">
  <div class="left">
    <div class="tabs" id="tabs"></div>
    <div class="controls" id="engine"></div>
    <div class="toolbar" id="filters"></div>
    <div class="stage" id="stage"><img id="pageimg" alt="page"/></div>
  </div>
  <div class="right">
    <div class="panel"><h3>इस पेज की सटीकता</h3><div class="kpi" id="kpi"></div></div>
    <div class="panel"><h3>⬇ डाउनलोड / export</h3><div class="dl" id="downloads"></div></div>
    <div class="panel"><h3>चुना हुआ token</h3><div id="detail" class="mut">किसी बॉक्स पर क्लिक/hover करें…</div></div>
    <div class="panel"><h3>Confusion matrix — gold (पंक्ति) × system (स्तम्भ)</h3><div id="cm"></div></div>
    <div class="panel"><h3>गलतियाँ कहाँ</h3><div id="err"></div></div>
    <div class="panel"><h3>रंग/रैंक</h3><div class="leg" id="legend"></div></div>
  </div>
</div>
<script id="data" type="application/json">__DATA__</script>
<script>
__JS__
</script>
</body>
</html>
