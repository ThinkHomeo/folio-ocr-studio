name: Project checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install app and test dependencies
        run: python -m pip install -e ".[test]"
      - name: Python regression checks
        run: python -m unittest discover -s tests -v
      - name: Offline UI controller checks
        run: node --test tests/test_review_ui.cjs tests/test_setup_ui.cjs
      - name: Verify clean source archive
        run: python tools/prepare_github.py
